services:
  workspace-teams:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_PATH: /data/workspace.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - workspace-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  workspace-data:
